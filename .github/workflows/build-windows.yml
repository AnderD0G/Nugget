name: Build Windows EXE

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tagged commit is on qt3.0
        shell: bash
        run: |
          git fetch origin qt3.0 --depth=1
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/qt3.0"; then
            echo "Tag does not point to a commit on qt3.0. Skipping build."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Build Windows onefile EXE
        run: python compile_onefile.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nugget-Windows-EXE-${{ github.ref_name }}
          path: dist/NuggetOnefile.exe

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nugget-Windows-build-logs-${{ github.ref_name }}
          path: |
            build/**
            *.spec
            dist/**
